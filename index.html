<!doctype html>
<html lang="en" data-theme="abelink">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon inline (data URI): tanpa ini WebKit meminta /favicon.ico -> 404 di log tiap boot -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23295137'/%3E%3Cpath d='M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z' fill='%23a3e635'/%3E%3C/svg%3E"
    />
    <title>Abelink</title>
    <style>
      /* Linux WebKitGTK: cat background opaque sejak awal (anti transparan) */
      html,
      body {
        /* Alpha dikendalikan --win-alpha (Transparansi di General). */
        background: rgba(11, 15, 12, var(--win-alpha, 1)) !important;
      }
    </style>
    <!-- CSP ketat (audit 2026-08-26): tanpa unsafe-eval (WASM pakai wasm-unsafe-eval),
         connect-src dibatasi localhost + https (custom API/LM Studio tetap hidup),
         img-src tanpa http wildcard. Policy produksi juga diset di tauri.conf.json. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; script-src 'self' 'wasm-unsafe-eval' blob: https://www.youtube.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' data: blob: https://*.googlevideo.com https://*.youtube.com https:; connect-src 'self' ipc: http://ipc.localhost blob: data: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://*; object-src 'none'; base-uri 'self'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
