name: Tauri CI

on:
  push:
    branches: ["main", "linux"]
  pull_request:
    branches: ["main", "linux"]

jobs:
  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action memanggil GET /pulls/{n}/commits pada event
      # pull_request (ScanPullRequest) — tanpa ini 403 dan job merah
      # padahal tidak ada secret yang bocor.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend test + build (vitest, vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint (eslint)
        run: bun run lint
      - name: Unit tests (vitest)
        run: bunx vitest run
      - name: Frontend build (vite)
        run: bun run build

  benchmark:
    name: Benchmark smoke (evaluation harness)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Task registry + adapter import
        run: bun evaluation/smoke.mjs

  rust:
    name: Rust check (src-tauri)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build sidecar (tauri build script embeds ../dist-sidecar/mark-engine)
        run: bun run build:sidecar
      - name: Rust check + tests
        run: |
          cargo check
          cargo test
        working-directory: src-tauri

  bundle:
    name: Bundle AppImage/deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/tauri-migration' || github.ref == 'refs/heads/linux' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [secrets, frontend, benchmark, rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build sidecar (single-file)
        run: bun run build:sidecar
      - name: Smoke test sidecar binary
        run: |
          printf '%s\n' '{"id":1,"action":"ping","payload":[]}' | timeout 20 ./dist-sidecar/mark-engine | grep -q engine:ready
      - run: bun tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: mark-light-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
