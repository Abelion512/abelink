name: Tauri CI

# Hemat menit runner: push beruntun di branch sama membatalkan run lama;
# PR dari branch yang sama tidak memicu run push ganda (skip_push_on_pr).
concurrency:
  group: tauri-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "linux"]
    # Docs-only push tidak perlu CI penuh (hemat menit runner).
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: ["main", "linux"]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action memanggil GET /pulls/{n}/commits pada event
      # pull_request (ScanPullRequest) — tanpa ini 403 dan job merah
      # padahal tidak ada secret yang bocor.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend test + build (vitest, vite)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Lint (eslint)
        run: bun run lint
      # BLOK sejak M2a (2026-09-26): seluruh subtree yang tercakup tsconfig
      # (src, sidecar, scripts, evaluation, tests, cli, bin) sudah 0 error,
      # termasuk 3 berkas TUI yang sebelumnya 114 error. Jika langkah ini merah,
      # ada berkas .ts/.tsx baru yang belum bertipe — jangan di-soft-fail-kan lagi.
      # `typecheck:tests` = sub-gate W7 (tsconfig.tests.json) untuk 174 berkas
      # tests/ yang sudah .ts; gate ini longgar (noImplicitAny/strict off) karena
      # pengetikan penuh 150+ test ditunda ke W9, tapi sintaks tetap wajib valid.
      # `typecheck:extension` = sub-gate W8 (tsconfig.extension.json) untuk
      # extension/src/**; strict penuh, types:[] supaya tidak bisa bocor ke Node.
      - name: Typecheck (tsc)
        run: |
          bun run typecheck
          bun run typecheck:node
          bun run typecheck:renderer
          bun run typecheck:tests
          bun run typecheck:extension
      # Ratchet W0 (js-to-ts-spec.md): dilarang menambah file .js/.jsx/.mjs
      # baru di zona migrasi selama program migrasi TS berjalan (blocker B-13).
      - name: No-new-JS ratchet (zona migrasi)
        run: bash scripts/ci/no-new-js.sh
      # Ratchet W9: `any` eksplisit yang sudah ada adalah debt warisan, tapi
      # TIDAK BOLEH bertambah. Dijaga per zona (contract / tests) supaya perbaikan
      # di test tidak menutupi additions di zona kontrak produksi. Baseline
      # terukur di scripts/ci/any-baseline.json — kalau turun, ikut turunkan
      # sekalian di PR yang sama, kalau tidak ratchet tidak mengatup.
      - name: Any-ratchet (tidak boleh bertambah)
        run: bash scripts/ci/any-ratchet.sh
      - name: Unit tests (vitest)
        run: bunx vitest run
      - name: Extension build (transpile .ts -> .js, service worker ESM)
        run: bun run build:extension
      - name: Extension gate (ID pin, token path, flavor isolation)
        run: bunx vitest run tests/browser-e2e.test.ts tests/native-host.test.ts tests/browser-flavor.test.ts
      - name: Frontend build (vite)
        run: bun run build

  benchmark:
    name: Benchmark smoke (evaluation harness)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Task registry + adapter import
        run: bun evaluation/smoke.ts

  cli-entries:
    name: CLI entry smoke (bin/*.ts hidup)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: CLI headless --help
        run: bun bin/abelink.ts --help > /dev/null
      - name: CLI TUI --help
        run: bun bin/abelink-tui.ts --help > /dev/null
      - name: CLI cron list
        run: bun bin/abelink-cron.ts list > /dev/null

  rust:
    name: Rust check (src-tauri)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build sidecar (tauri build script embeds ../dist-sidecar/abelink-engine)
        run: bun run build:sidecar
      - name: Rust clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust check + tests
        run: |
          cargo check
          cargo test
        working-directory: src-tauri

  bundle:
    name: Bundle AppImage/deb
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/linux' || startsWith(github.ref, 'refs/tags/')
    needs: [secrets, frontend, benchmark, rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build sidecar (single-file)
        run: bun run build:sidecar
      - name: Smoke test sidecar binary
        # Dijalankan DARI dist-sidecar (cwd netral): binary hasil `bun build
        # --compile` masih membaca bunfig.toml dari cwd, dan preload TUI
        # (@opentui/solid/preload) di root tidak tersedia untuk binary compile.
        # Layout produksi juga cwd netral — smoke ini setia pada kondisi runtime.
        run: |
          printf '%s\n' '{"id":1,"action":"ping","payload":[]}' | ( cd dist-sidecar && timeout 20 ./abelink-engine ) | grep engine:ready > /dev/null
      - run: bun tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: abelink-light-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
