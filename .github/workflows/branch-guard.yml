name: Branch Guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: read
  contents: read

jobs:
  guard-base-branch:
    name: Tolak PR yang menargetkan master
    runs-on: ubuntu-latest
    steps:
      - name: Validasi branch target
        if: ${{ github.event.pull_request.base.ref == 'master' }}
        run: |
          echo "::error::PR menargetkan 'master'. Di repo abelink, branch 'master' murni melacak upstream resmi Mazees/mark-agent. Semua PR harus menargetkan 'main' (pengembangan aktif) atau 'linux' (sinkronisasi public-upstream)."
          exit 1
