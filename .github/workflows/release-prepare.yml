name: Release Prepare

# Manual + kadens mingguan: workflow_dispatch (tombol owner) ATAU cron Senin
# 02:00 UTC. Guard bawaan release-helper: bila tak ada commit releasable sejak
# tag terakhir, run selesai tanpa membuat apa pun -> minggu sepi = no-op.
# Setiap PR rilis berlabel `release` (label grup, dipasang release-helper).
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Prepare release
        run: bun scripts/release-helper.ts prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}