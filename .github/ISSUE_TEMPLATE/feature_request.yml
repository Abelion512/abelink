name: ✨ Feature Request
description: Suggest an idea for Abelink Agent
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing feature requests](https://github.com/Abelion512/abelink/labels/enhancement) first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "When I'm doing X, I wish Abelink could..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: type
    attributes:
      label: Category
      options:
        - label: New integration / provider
        - label: UI / UX improvement
        - label: Performance / memory
        - label: Security
        - label: Documentation
