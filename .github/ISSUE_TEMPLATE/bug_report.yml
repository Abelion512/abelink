name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: [bug, triage]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Check [existing issues](https://github.com/Abelion512/abelink/issues) first.

  - type: dropdown
    id: version
    attributes:
      label: Version
      options:
        - v1.0.0-alpha.x (current)
        - Built from source (linux branch)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (AppImage)
        - Linux (deb)
        - Linux (snap)
        - Linux (built from source)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "Clear, concise bug description..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open Abelink Agent
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: AI config (optional)
      render: yaml
    validations:
      required: false
