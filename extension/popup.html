<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; background: #0b0f0c; color: #e6efe9; }
    h1 { font-size: 14px; margin: 0 0 8px; color: #1fb854; letter-spacing: 0.08em; text-transform: uppercase; }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin: 2px 0 6px; }
    .pill.ok { background: #123f27; color: #4ade80; }
    .pill.warn { background: #3f2f12; color: #fbbf24; }
    .pill.err { background: #3f1212; color: #ff6b6b; }
    label { display: block; font-size: 11px; opacity: 0.7; margin: 8px 0 2px; }
    input { width: 100%; box-sizing: border-box; background: #16211b; color: #e6efe9; border: 1px solid #2a3a31; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
    button { margin-top: 10px; width: 100%; background: #1fb854; color: #06130b; font-weight: 700; border: 0; border-radius: 6px; padding: 8px 0; cursor: pointer; }
    button.secondary { background: #2a3a31; color: #e6efe9; }
    button[hidden] { display: none; }
    #status { font-size: 11px; margin-top: 10px; line-height: 1.5; opacity: 0.85; white-space: pre-wrap; }
    #task { font-size: 11px; margin-top: 6px; opacity: 0.85; }
    details { font-size: 11px; margin-top: 10px; opacity: 0.8; }
    .ok { color: #1fb854; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="" width="24" height="24" style="vertical-align:-5px" /> Abelink Bridge</h1>
  <div id="ports" style="margin-bottom: 4px;"></div>
  <div><span id="pill" class="pill warn">menghubungkan…</span></div>
  <div id="status">Memuat status...</div>
  <div id="task"></div>
  <button id="reconnect" hidden>Connect to Abelink</button>
  <button id="closeTabs" class="secondary" hidden>Tutup tab task ini</button>
  <details style="margin-top: 14px;">
    <summary style="cursor: pointer; opacity: 0.6;">Opsi Manual (Fallback)</summary>
    <label>Token (otomatis terisi via Abelink Native Host):</label>
    <input id="token" type="password" placeholder="tempel token bila otomatis gagal" />
    <label>Session ID</label>
    <input id="session" type="text" value="default" />
    <label>Port bridge (prod 49712, dev 49713)</label>
    <input id="port" type="text" value="" placeholder="49712" />
    <button id="start">Sambungkan manual</button>
  </details>
  <script src="popup.js"></script>
</body>
</html>
